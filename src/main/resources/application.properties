# ==============================================
# Application Configuration (dummy values)
# ==============================================

# --- Application info ---
spring.application.name=my-weather-service

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- OpenWeatherMap API (dummy values) ---
weather.api.base-url=http://api.openweathermap.org/data/2.5/weather
weather.api.key=your-api-key-here
weather.api.units=metric

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
